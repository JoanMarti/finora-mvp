name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        id: analyze
        # Re-emit analyzer findings as annotations so they show on the PR.
        run: |
          status=0
          flutter analyze --no-pub > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          grep -E '^ *(error|warning|info) • ' analyze.txt \
            | sed -E 's/^ *(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/::\1 file=\3,line=\4,col=\5::\2 [\6]/' \
            | sed 's/^::info /::notice /' || true
          exit $status
      - name: Test
        if: ${{ !cancelled() }}
        # Failures are re-emitted as one annotation so they are readable on the PR.
        run: |
          status=0
          flutter test --no-pub --reporter expanded > test.txt 2>&1 || status=$?
          cat test.txt
          if [ "$status" -ne 0 ]; then
            details=$(grep -E -A14 'The following|\[E\]' test.txt | grep -vE '^--$|package:flutter|package:stack_trace|dart:async|package:test_api|package:matcher' | head -120 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Failing tests::${details}"
          fi
          exit $status
      - name: Contract fixture
        if: ${{ !cancelled() }}
        # The reference backend serves fixtures generated from the demo data;
        # fail when the committed file no longer matches.
        run: |
          UPDATE_FIXTURES=1 flutter test --no-pub test/contract_test.dart
          if ! git diff --quiet -- server/fixtures/demo.json; then
            echo "::error file=server/fixtures/demo.json::Out of date. Run UPDATE_FIXTURES=1 flutter test test/contract_test.dart and commit the result."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: demo-fixture
          path: server/fixtures/demo.json
      - name: Reference backend
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          dart pub get
          status=0
          dart analyze --fatal-infos > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          grep -E '^ *(error|warning|info) - ' analyze.txt \
            | sed -E 's/^ *(error|warning|info) - ([^:]+):([0-9]+):([0-9]+) - (.*)$/::error file=server\/\2,line=\3,col=\4::\5/' || true
          if [ "$status" -ne 0 ]; then exit $status; fi
          dart test --reporter expanded
      - run: flutter build web --release --base-href /finora-mvp/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
