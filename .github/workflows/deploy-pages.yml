name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        id: analyze
        # Re-emit analyzer findings as annotations so they show on the PR.
        run: |
          status=0
          flutter analyze --no-pub > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          grep -E '^ *(error|warning|info) • ' analyze.txt \
            | sed -E 's/^ *(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/::\1 file=\3,line=\4,col=\5::\2 [\6]/' \
            | sed 's/^::info /::notice /' || true
          exit $status
      - name: Test
        if: ${{ !cancelled() }}
        # Failures are re-emitted as one annotation so they are readable on the PR.
        run: |
          status=0
          flutter test --no-pub --reporter expanded > test.txt 2>&1 || status=$?
          cat test.txt
          if [ "$status" -ne 0 ]; then
            details=$(grep -E -A14 'The following|\[E\]' test.txt | grep -vE '^--$|package:flutter|package:stack_trace|dart:async|package:test_api|package:matcher' | head -120 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Failing tests::${details}"
          fi
          exit $status
      - name: Contract fixture
        if: ${{ !cancelled() }}
        # The reference backend serves a fixture generated from the demo
        # data; the "fixture" job below commits it when it changes.
        run: UPDATE_FIXTURES=1 flutter test --no-pub test/contract_test.dart
      - name: Reference backend
        if: ${{ !cancelled() }}
        working-directory: server
        run: |
          dart pub get
          status=0
          dart analyze --fatal-infos > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          grep -E '^ *(error|warning|info) - ' analyze.txt \
            | sed -E 's/^ *(error|warning|info) - ([^:]+):([0-9]+):([0-9]+) - (.*)$/::error file=server\/\2,line=\3,col=\4::\5/' || true
          if [ "$status" -ne 0 ]; then exit $status; fi
          dart test --reporter expanded
      - run: flutter build web --release --base-href /finora-mvp/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Keeps generated files in step on pull requests, so nobody has to
  # regenerate them by hand: the reference backend fixture and the
  # screenshots of the main screens (docs/screenshots).
  fixture:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Regenerate and commit generated files
        run: |
          UPDATE_FIXTURES=1 flutter test --no-pub test/contract_test.dart
          SCREENSHOTS=1 flutter test --no-pub --update-goldens test/screenshots
          git add server/fixtures/demo.json docs/screenshots
          if git diff --cached --quiet; then
            echo "Fixture is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated fixture and screenshots"
          git push
